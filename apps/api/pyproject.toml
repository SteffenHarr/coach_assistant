[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coach_api"
version = "0.1.0"
description = "Tennis training plan optimizer + LLM agent (API)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "fastapi-users[sqlalchemy]>=14.0",
  "argon2-cffi>=23.1",
  "python-jose[cryptography]>=3.3",
  "slowapi>=0.1.9",
  "redis>=5.1",
  "rq>=2.0",
  "ortools>=9.11",
  "langgraph>=0.2.40",
  "langchain>=0.3",
  "langchain-ollama>=0.2",
  "httpx>=0.27",
  "ics>=0.7",
  "reportlab>=4.2",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coach_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]
ignore = ["S101"]  # asserts in tests are fine

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
