# Coach Assistant – Docker Compose
#
# This stack runs entirely with open-source software and requires no paid services.
# In dev: Caddy serves both the SPA and proxies /api/* and /chat/* to the API.
# In prod: set DOMAIN and TLS_EMAIL in .env to enable automatic Let's Encrypt TLS.

name: coach-assistant

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # IMPORTANT: not exposed to the host. Only reachable inside the Docker network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: [internal]

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file: [../.env]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [internal]
    # Run migrations then start uvicorn
    command:
      - /bin/sh
      - -c
      - "alembic upgrade head && uvicorn coach_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: [../.env]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [internal]

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    networks: [internal]
    # Serves /srv/web via Caddy (configured by the proxy below)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Bound to loopback only — the Cloudflare Tunnel doesn't need these at
      # all (it reaches caddy via the internal Docker network by service
      # name), they only exist for local https://localhost testing. Without
      # this restriction, anyone on the same LAN/WiFi could reach the app
      # directly by IP, bypassing Cloudflare's protections entirely.
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS_EMAIL: ${TLS_EMAIL:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Named tunnel bound to a stable hostname (see docs/SETUP.md, Schritt 7,
    # Variante A). The Public Hostname -> Service mapping is configured in
    # the Cloudflare dashboard, not here. CLOUDFLARE_TUNNEL_TOKEN is
    # optional — if unset, this container just idles/restarts without a
    # token; it does not block the rest of the stack from starting (e.g.
    # local-only use, or before Schritt 7 has been done yet).
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [internal]
    depends_on: [caddy]

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
